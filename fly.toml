# Fly configuration for the workspace app. Written and reviewable; nothing in
# this build deploys it, and no Fly account is touched.

app = "duplexd-workspace"
primary_region = "lhr"

[build]
  dockerfile = "apps/workspace/Dockerfile"

[deploy]
  # Migrations run once per release, before any new machine serves traffic, so
  # a deploy cannot serve a schema that has not been applied. This is why the
  # image does not migrate on boot.
  release_command = "pnpm --filter workspace db:migrate"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets are set with `fly secrets set`, never in this file or the image:
#   DATABASE_URL           the Neon connection string
#   BETTER_AUTH_SECRET     session signing secret
#   ASSISTANT_SECRET_KEY   32 bytes hex, encrypts assistants' webhook secrets
