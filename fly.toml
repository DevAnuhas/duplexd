# Fly configuration for the workspace app. Written and reviewable; nothing in
# this build deploys it, and no Fly account is touched.

app = "duplexd-workspace"
primary_region = "lhr"

[build]
  dockerfile = "apps/workspace/Dockerfile"

[deploy]
  # Migrations run once per release, before any new machine serves traffic, so
  # a deploy cannot serve a schema that has not been applied. This is why the
  # image does not migrate on boot: every machine in a deploy would race.
  #
  # This runs inside the built image, which is Next standalone output — there is
  # no pnpm workspace and no src/ in there, so a `pnpm --filter` script cannot
  # work. `migrate.mjs` is a self-contained bundle that needs only `drizzle/`.
  release_command = "node /app/migrate.mjs"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets are set with `fly secrets set`, never in this file or the image:
#   DATABASE_URL           the Neon connection string
#   BETTER_AUTH_SECRET     session signing secret
#   BETTER_AUTH_URL        public workspace origin
#   ASSISTANT_SECRET_KEY   32 bytes hex, encrypts assistants' webhook secrets
#   PIPECAT_API_KEY        starts the deployed Pipecat agent
