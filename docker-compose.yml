services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: duplexd
      POSTGRES_PASSWORD: duplexd
      POSTGRES_USER: duplexd
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U duplexd -d duplexd']
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
